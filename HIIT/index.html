<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIT Timer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            transition: background-color 0.15s ease;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
        }

        .settings {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 60px;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: none;
            border-radius: 8px;
            margin-top: 5px;
        }

        #status {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
            text-transform: uppercase;
        }

        #timer {
            font-size: 8rem;
            font-weight: bold;
            line-height: 1;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        #round-info {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            transition: transform 0.1s, background-color 0.2s;
            margin: 0 10px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HIIT Timer</h1>
        
        <div class="settings" id="settings">
            <div class="setting-group">
                <label>Prepare</label>
                <input type="number" id="prep-time" value="10" min="0">
            </div>
            <div class="setting-group">
                <label>Work</label>
                <input type="number" id="work-time" value="30" min="1">
            </div>
            <div class="setting-group">
                <label>Rest</label>
                <input type="number" id="rest-time" value="10" min="1">
            </div>
            <div class="setting-group">
                <label>Rounds</label>
                <input type="number" id="rounds" value="8" min="1">
            </div>
        </div>

        <div id="status">Ready</div>
        <div id="timer">00:00</div>
        <div id="round-info">Round 0 / 0</div>

        <div>
            <button id="start-btn">Start</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>

    <script>
        // 1. 初始化 5 個 MP3 音檔 (包含新增的 whistle.mp3，音量全部設定為最大 1.0)
        const audioFiles = {
            whistle: new Audio('whistle.mp3'),
            start: new Audio('start.mp3'),
            work: new Audio('work.mp3'),
            rest: new Audio('rest.mp3'),
            crushed: new Audio('crushed.mp3')
        };

        Object.values(audioFiles).forEach(audio => {
            audio.volume = 1.0; 
            audio.preload = 'auto';
            audio.load();
        });

        // 2. Web Audio API 倒數嗶嗶聲 (音量 1.0, 880Hz)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playBeep(frequency = 880, duration = 200, volume = 1.0) {
            if (!audioCtx) audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration / 1000));
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + (duration / 1000));
        }

        // 3. 純 MP3 音檔播放函數
        function playSound(name) {
            if (audioFiles[name]) {
                audioFiles[name].currentTime = 0;
                audioFiles[name].play().catch(e => console.log(`播放 ${name}.mp3 失敗:`, e));
            }
        }

        let prepTime, workTime, restTime, totalRounds;
        let currentRound = 1;
        let timeLeft = 0;
        let phase = 'ready'; 
        let timerInterval = null;
        let isRunning = false;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            document.getElementById('timer').innerText = formatTime(timeLeft);
            document.getElementById('round-info').innerText = `Round ${currentRound} / ${totalRounds}`;
            
            if (phase === 'prepare') {
                document.getElementById('status').innerText = "Prepare";
                document.body.style.backgroundColor = "#e67e22"; 
            } else if (phase === 'work') {
                document.getElementById('status').innerText = "Work!";
                document.body.style.backgroundColor = "#e74c3c"; 
            } else if (phase === 'rest') {
                document.getElementById('status').innerText = "Rest";
                document.body.style.backgroundColor = "#2ecc71"; 
            }
        }

        function tick() {
            timeLeft--;

            // 倒數 3, 2, 1 秒時發出最大聲嗶嗶聲
            if (timeLeft === 3 || timeLeft === 2 || timeLeft === 1) {
                playBeep(880, 200, 1.0);
            }
            
            // 時間歸零瞬間【立刻】喊出下一個階段的 MP3 音檔
            if (timeLeft <= 0) {
                if (phase === 'prepare') {
                    phase = 'work';
                    timeLeft = workTime;
                    playSound('work');
                } else if (phase === 'work') {
                    if (currentRound >= totalRounds) {
                        finishWorkout();
                        return;
                    }
                    phase = 'rest';
                    timeLeft = restTime;
                    playSound('rest');
                } else if (phase === 'rest') {
                    phase = 'work';
                    timeLeft = workTime;
                    currentRound++;
                    playSound('work');
                }
                updateUI();
            } else {
                document.getElementById('timer').innerText = formatTime(timeLeft);
            }
        }

        function finishWorkout() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('start-btn').innerText = "Start";
            document.body.style.backgroundColor = "#f1c40f";
            document.getElementById('status').innerText = "Completed!";
            document.getElementById('timer').innerText = "00:00";
            playSound('crushed');
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                document.getElementById('start-btn').innerText = "Resume";
            } else {
                if (phase === 'ready') {
                    prepTime = parseInt(document.getElementById('prep-time').value);
                    workTime = parseInt(document.getElementById('work-time').value);
                    restTime = parseInt(document.getElementById('rest-time').value);
                    totalRounds = parseInt(document.getElementById('rounds').value);
                    currentRound = 1;
                    
                    if (prepTime > 0) {
                        phase = 'prepare';
                        timeLeft = prepTime;
                        
                        // 先播放真實哨聲 whistle.mp3，0.7 秒後緊接著喊 start.mp3
                        playSound('whistle');
                        setTimeout(() => {
                            playSound('start');
                        }, 700);
                    } else {
                        phase = 'work';
                        timeLeft = workTime;
                        playSound('work');
                    }
                    updateUI();
                }
                
                timerInterval = setInterval(tick, 1000);
                isRunning = true;
                document.getElementById('start-btn').innerText = "Pause";
                document.getElementById('settings').style.display = "none";
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            phase = 'ready';
            timeLeft = 0;
            document.getElementById('start-btn').innerText = "Start";
            document.body.style.backgroundColor = "#2c3e50";
            document.getElementById('status').innerText = "Ready";
            document.getElementById('timer').innerText = "00:00";
            document.getElementById('round-info').innerText = "Round 0 / 0";
            document.getElementById('settings').style.display = "flex";
            
            Object.values(audioFiles).forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
        });
    </script>
</body>
</html>
